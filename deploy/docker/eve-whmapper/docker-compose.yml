services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: whmapper
      PGDATA: /data/postgres
    volumes:
     - postgres:/data/postgres
    networks:
     - net

  redis:
    image: redis:8-alpine
    restart: always
    networks:
     - net

  whmapper:
    image: ghcr.io/pfh59/eve-whmapper:latest
    restart: unless-stopped
    environment:
     - EveSSO__ClientId=xxxxxxxxx
     - EveSSO__Secret=xxxxxxxxx
     - ConnectionStrings__DatabaseConnection=server=db;port=5432;database=whmapper;User Id=postgres;Password=secret
     - ConnectionStrings__RedisConnection=redis:6379
     - Serilog__MinimumLevel__Default=Warning
     - Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command=Warning
     # Optional AI report of the Intel dialog: any OpenAI-compatible endpoint, empty = disabled.
     - Intel__Ai__Endpoint=${INTEL_AI_ENDPOINT:-}
     - Intel__Ai__Model=${INTEL_AI_MODEL:-}
     - Intel__Ai__ApiKey=${INTEL_AI_API_KEY:-}
    links:
      - db
      - redis
    depends_on:
      - db
      - redis
    networks:
     - net
    volumes:
     - ./Logs:/app/Logs

  # Local AI model, started only with the "ai" profile:
  #   INTEL_AI_ENDPOINT=http://ollama:11434/v1 INTEL_AI_MODEL=qwen3:8b docker compose --profile ai up -d
  # (or put both variables in a .env file next to this file).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [ "ai" ]
    environment:
      # The intel prompt (50 kills as JSON) exceeds Ollama's default context window.
      - OLLAMA_CONTEXT_LENGTH=16384
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - net
    # Uncomment to use an NVIDIA GPU (requires the NVIDIA Container Toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [ gpu ]

  # Downloads the model once; the volume keeps it across restarts.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ "ai" ]
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: [ "ollama", "pull", "${INTEL_AI_MODEL:-qwen3:8b}" ]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - net

networks:
  net:

volumes:
    postgres:
    ollama: